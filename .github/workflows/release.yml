# Fern-SDRPlay, an SDRplay RSP input module for FernSDR.
# SPDX-License-Identifier: GPL-2.0-or-later WITH AdditionRef-Fern-SDRPlay-API-exception
#
# On a tag v<version>: test against the fake SDRplay library, build the
# x86_64 package in the Debian 10 container (glibc 2.28), and attach it to
# the GitHub release. SDRplay's own library is never downloaded or shipped.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag names the version in the Makefile
        run: |
          version=$(make -s print-version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

      - name: Test
        run: make -j"$(nproc)" test

      - name: Build the package
        run: make package

      - name: Attach the package to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.fernmod
          fail_on_unmatched_files: true
